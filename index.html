<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine</title>
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="movie" id="movie">

        <div class="content">

            <p class="eyebrow">RECOMENDACIÓN DE PELICULAS</p>

            <H1 id="movie-title"> Soy tu asesor de cine</H1>

            <p id="movie-description">
                Estoy para recomendarte una película
                disponible acorde a tu edad.
            </p>

            <form id="age-form" >
                <label for="age">Ingresa tu edad</label>

                <div class="form-row">
                    <input
                        type="number"
                        id="age"
                        placeholder="Ej. 18"
                    >

                    <button type="submit">
                        Recomendar película
                    </button>
                </div>

            </form>

            <p id="message"></p>
            <p id="age-range"></p>
            <p id="rating"></p>

        </div>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
